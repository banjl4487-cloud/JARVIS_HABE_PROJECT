<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System</title>
    <style>
        /* 🌟 주현이의 원형 홀로그램 UI 디자인 사수 */
        body {
            background-color: #050505;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }

        /* 3D 코어 배경 공간 */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 원형 홀로그램 아크 원자로 UI 스타일 */
        #jarvis-core-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }

        #jarvis-core {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff;
            position: absolute;
            animation: pulse 2s infinite;
        }

        #jarvis-core-inner {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff;
            animation: spin 10s linear infinite;
        }

        /* 하단 홀로그램 텍스트 */
        #status {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00f0ff;
            margin-top: 30px;
            z-index: 10;
        }

        /* UI 애니메이션 */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    
    <div id="status">TOUCH TO SYNC SYSTEM</div>

    <script>
        let recognition;
        let renderer; 
        let isListening = false;
        let isFirstCall = true;       // "네, 주인님" 최초 응답 제어용 플래그
        let chatHistory = [];         // 🌟 대화 흐름을 기억하기 위한 맥락 저장 창고
        let isJarvisSpeaking = false; // 🌟 자비스 답변 중 소음/스피커 소리 차단용 플래그

        // 1. 자막 없이 오디오로만 출력하는 기능
        function speak(text) {
            if (recognition) {
                recognition.stop();
                isListening = false;
            }

            // 자비스 발화 시작 -> 다른 음성/잡음 유입 원천 차단
            isJarvisSpeaking = true; 

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';

            utterance.onend = function() {
                // 발화가 완전히 끝나면 차단 풀고 다시 마이크 가동
                isJarvisSpeaking = false; 
                if (recognition) {
                    recognition.start();
                    isListening = true;
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // 2. 주현이의 커스텀 llama-server (OpenAI 규격 호환) 연동 및 추론 기능
        async function fetchToGemma(userQuestion) {
            try {
                // 능지 극대화 및 구라 방지용 마스터 시스템 지침
                const systemPrompt = `너는 오직 주인님(주현)만을 위해 작동하는 스마트한 개인 AI 비서 '자비스'다. 다음 지침을 절대적으로 준수하라.
1. [필수 프로토콜] 답변의 첫마디는 무조건 "네, 주인님."으로 시작하라. 예외는 없다.
2. [생각의 깊이] 결론을 성급하게 내지 말고, 단계별로 차근차근 추론(Step-by-step thinking)하여 가장 논리적이고 똑똑하게 답변하라.
3. [구라 방지 치트키] 네가 모르는 정보거나 확실하지 않은 내용이라면 절대 지어내지 말고 "모릅니다" 또는 "확실하지 않습니다"라고 솔직하게 선을 그어라.
4. [형식 자율] 답변의 길이나 형식(장문 브리핑, 리스트, 코드 등)은 그 어떤 제한도 두지 말고 자유롭게 출력하라.`;

                // OpenAI 규격에 맞춘 메시지 포맷 구조화
                let messages = [
                    { role: "system", content: systemPrompt }
                ];

                // chatHistory에 누적된 과거 대화 맥락을 페이로드에 빌드업
                chatHistory.forEach(chat => {
                    messages.push({ role: "user", content: chat.user });
                    messages.push({ role: "assistant", content: chat.model });
                });

                // 최신 질문 결합
                messages.push({ role: "user", content: userQuestion });

                // 🌟 주현이의 도커 기반 llama-server 로컬 엔드포인트 타격
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/v1/chat/completions", { 
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: messages,
                        temperature: 0.4,
                        max_tokens: 512 // 자유롭고 풍부한 답변 출력을 위해 토큰 락 해제
                    })
                });

                if (!response.ok) {
                    throw new Error(`llama-server 엔진 응답 실패: ${response.status}`);
                }

                const result = await response.json();
                
                // 표준 OpenAI 챗 포맷에 맞춰 데이터 파싱
                let reply = result.choices[0].message.content.trim();

                // 이번 턴의 대화를 기억 저장소에 세이브 (최근 5개 큐 유지)
                chatHistory.push({ user: userQuestion, model: reply });
                if (chatHistory.length > 5) chatHistory.shift(); 

                speak(reply);

            } catch (error) {
                console.error("자비스 GGUF 엔진 통신 에러:", error);
                speak("네, 주인님. 서버 연결이 원활하지 않습니다.");
                isJarvisSpeaking = false; 
            }
        }

        // 3. 음성 명령 핸들러 (내 목소리만 필터링)
        async function handleVoiceCommand(speechResult) {
            // 🌟 자비스가 대답하고 있는 도중에는 스피커 소리나 주변 잡음 싹 무시
            if (isJarvisSpeaking) return; 

            const command = speechResult.replace(/\s+/g, ""); 

            // 규칙 1: 시스템 가동 후 최초로 "자비스"라고 불렀을 때 작동
            if (isFirstCall && command.includes("자비스")) {
                isFirstCall = false; 
                speak("네, 주인님.");
                return;
            }

            // 규칙 2: 최초 부팅 완료 이후 들어오는 모든 자유로운 질문 처리
            if (!isFirstCall) {
                if (command.includes("종료") || command.includes("쉬어")) {
                    speak("네, 주인님. 시스템을 대기 상태로 전환합니다.");
                    isFirstCall = true; 
                    chatHistory = []; // 대기 상태 진입 시 대화 기억 초기화
                    return;
                } 
                
                // 하드코딩 답변 없이 주현이의 커스텀 GGUF 엔진으로 토스!
                await fetchToGemma(speechResult);
            }
        }

        // 4. 시스템 가동 (화면 클릭 시 귀 열기)
        document.body.onclick = async () => {
            if (renderer) return; 
            if (typeof initJarvis === "function") initJarvis(); 
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'ko-KR';

                recognition.onresult = function(event) {
                    const speechResult = event.results[event.resultIndex][0].transcript.trim();
                    console.log("인식된 대사:", speechResult);
                    handleVoiceCommand(speechResult);
                };

                recognition.start();
                isListening = true;
                
                if (document.getElementById('status')) {
                    document.getElementById('status').innerText = "SYSTEM ONLINE";
                }
                
            } catch(e) {
                console.error("마이크 권한 획득 실패:", e);
            }
        };

        // 기존 3D 그래픽 초기화용 함수 껍데기 유지
        function initJarvis() {
            console.log("3D Core Activating...");
            renderer = true; 
        }
    </script>
</body>
</html>
