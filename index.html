<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System</title>
    <style>
        /* 🌟 주현이의 시그니처 원형 홀로그램 UI 디자인 철저히 사수 */
        body {
            background-color: #050505;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #jarvis-core-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }

        #jarvis-core {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff;
            position: absolute;
            animation: pulse 2s infinite;
        }

        #jarvis-core-inner {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff;
            animation: spin 10s linear infinite;
        }

        #status {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00f0ff;
            margin-top: 30px;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="status">TOUCH TO SYNC SYSTEM</div>

    <script>
        let recognition;
        let renderer; 
        let isListening = false;
        let isFirstCall = true;       
        let chatHistory = [];         
        let isJarvisSpeaking = false; 

        // 주현이 목소리 필터링용 Web Audio API 변수
        let audioContext;
        let analyser;
        let microphoneStream;
        let isUserVoiceValid = false; 

        // 1. 자막 없이 오디오 출력 기능 (스피커 소음 유입 방지 포함)
        function speak(text) {
            if (recognition) {
                recognition.stop();
                isListening = false;
            }

            isJarvisSpeaking = true; 

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';

            utterance.onend = function() {
                isJarvisSpeaking = false; 
                if (recognition) {
                    recognition.start();
                    isListening = true;
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // 2. 🌟 벡엔드(허깅페이스 도커의 llama-server)로 추론 요청을 보내는 함수
        async function fetchToGemma(userQuestion) {
            try {
                const systemPrompt = `너는 오직 주인님(주현)만을 위해 작동하는 스마트한 개인 AI 비서 '자비스'다. 다음 지침을 절대적으로 준수하라.
1. [필수 프로토콜] 답변의 첫마디는 무조건 "네, 주인님."으로 시작하라.
2. [생각의 깊이] 단계별로 차근차근 추론(Step-by-step thinking)하여 가장 논리적이고 똑똑하게 답변하라.
3. [구라 방지] 모르는 것은 "모릅니다", 확실하지 않은 것은 "확실하지 않습니다"라고 솔직하게 선을 그어라.
4. [형식 자율] 답변의 길이나 형식은 제한 없이 자유롭게 출력하라.`;

                let messages = [{ role: "system", content: systemPrompt }];

                // 과거 대화 맥락 기억 유기적 누적
                chatHistory.forEach(chat => {
                    messages.push({ role: "user", content: chat.user });
                    messages.push({ role: "assistant", content: chat.model });
                });

                messages.push({ role: "user", content: userQuestion });

                // 🌟 버셀(프론트)에서 허깅페이스 스페이스(백엔드 도커) 엔드포인트 타격!
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/v1/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: messages,
                        temperature: 0.4,
                        max_tokens: 512
                    })
                });

                if (!response.ok) throw new Error(`도커 백엔드 응답 실패: ${response.status}`);

                const result = await response.json();
                let reply = result.choices[0].message.content.trim();

                // 큐 구조 대화 기억 세이브 (최근 5개 락)
                chatHistory.push({ user: userQuestion, model: reply });
                if (chatHistory.length > 5) chatHistory.shift(); 

                speak(reply);

            } catch (error) {
                console.error("백엔드 통신 에러:", error);
                speak("네, 주인님. 서버 연결이 원활하지 않습니다.");
                isJarvisSpeaking = false; 
            }
        }

        // 3. 음성 명령 핸들러 (오디오 필터 조건 검증 결과 매핑)
        async function handleVoiceCommand(speechResult) {
            if (isJarvisSpeaking) return; 

            // 🌟 오디오 분석기 필터를 통과하지 못한 타인의 목소리는 씹어버림
            if (!isUserVoiceValid) {
                console.log("❌ 주현이 목소리가 아니거나 소음이 심해 명령을 무시합니다.");
                return;
            }

            const command = speechResult.replace(/\s+/g, "").toLowerCase(); 

            // 최초 "자비스", "헤이자비스" 등 첫 호출 조건 완화
            if (isFirstCall && (command.includes("자비스") || command.includes("hey") || command.includes("헤이"))) {
                isFirstCall = false; 
                speak("네, 주인님.");
                return;
            }

            if (!isFirstCall) {
                if (command.includes("종료") || command.includes("쉬어")) {
                    speak("네, 주인님. 시스템을 대기 상태로 전환합니다.");
                    isFirstCall = true; 
                    chatHistory = []; 
                    return;
                } 
                await fetchToGemma(speechResult);
            }
        }

        // 4. 실시간 마이크 오디오 주파수/볼륨 분석 (주현 피치 필터링)
        function startAudioAnalysis(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyser);

            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function analyze() {
                requestAnimationFrame(analyze);
                if (isJarvisSpeaking) {
                    isUserVoiceValid = false;
                    return;
                }

                analyser.getByteFrequencyData(dataArray);

                let totalEnergy = 0;
                let targetEnergy = 0; 

                for (let i = 0; i < bufferLength; i++) {
                    totalEnergy += dataArray[i];
                    // 성인 남성 저음역대 피크 주파수 타겟팅 (80Hz ~ 250Hz 영역의 빈)
                    if (i >= 2 && i <= 8) { 
                        targetEnergy += dataArray[i];
                    }
                }

                let averageVolume = totalEnergy / bufferLength;

                // 볼륨 35 이하 소음 커트 및 남성 목소리 주파수 밀도 비율 검증
                if (averageVolume > 35 && (targetEnergy / totalEnergy) > 0.4) {
                    isUserVoiceValid = true; 
                } else {
                    isUserVoiceValid = false; 
                }
            }
            analyze();
        }

        // 5. 시스템 엔진 시동 (클릭 시 작동)
        document.body.onclick = async () => {
            if (renderer) return; 
            if (typeof initJarvis === "function") initJarvis(); 
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                microphoneStream = stream;
                
                startAudioAnalysis(stream);

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'ko-KR';

                recognition.onresult = function(event) {
                    const speechResult = event.results[event.resultIndex][0].transcript.trim();
                    console.log("인식된 대사:", speechResult);
                    handleVoiceCommand(speechResult);
                };

                recognition.start();
                isListening = true;
                
                if (document.getElementById('status')) {
                    document.getElementById('status').innerText = "SYSTEM ONLINE";
                }
                
            } catch(e) {
                console.error("시스템 매핑 실패:", e);
            }
        };

        function initJarvis() {
            console.log("3D Core Activating...");
            renderer = true; 
        }
    </script>
</body>
</html>
