<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - Hologram Core</title>
    <style>
        body {
            background-color: #030712; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }
        
        #jarvis-container {
            position: relative; width: 300px; height: 300px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
        }

        #jarvisCanvas {
            position: absolute; width: 100%; height: 100%;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.6));
            transition: filter 0.3s ease;
        }
        
        #response-box {
            position: absolute; bottom: 180px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.1rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
            max-height: 200px; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .control-panel {
            position: absolute; bottom: 40px; width: 100%; text-align: center; display: flex; justify-content: center; gap: 10px; align-items: center;
        }

        .cyber-btn {
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 12px 20px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .cyber-btn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        
        .cyber-btn.recording {
            background: rgba(255, 0, 85, 0.3) !important;
            color: #ff0055 !important;
            border-color: #ff0055 !important;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.8) !important;
        }
    </style>
</head>
<body>
    <div id="jarvis-container">
        <canvas id="jarvisCanvas" width="300" height="300"></canvas>
    </div>

    <div id="response-box"></div>

    <div class="control-panel">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 40%; max-width: 350px; border-radius: 4px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;"
               onkeypress="if(event.key === 'Enter') sendTextCommand()">
        
        <button id="textMicBtn" onclick="toggleInputSpeech()" class="cyber-btn">🎤 MIC</button>
        <button id="sendBtn" onclick="sendTextCommand()" class="cyber-btn" style="background: #00f0ff; color: #030712;">전송</button>
    </div>

    <script>
        let inputRecognition = null;
        let isInputRecording = false;
        let isProcessing = false;

        const canvas = document.getElementById("jarvisCanvas");
        const ctx = canvas.getContext("2d");
        let coreColor = "#00f0ff"; 
        let waveIntensity = 0.05;  
        let angle = 0;

        function drawHologramCore() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let baseRadius = 75;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);
            ctx.strokeStyle = coreColor;
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 15]);
            ctx.beginPath();
            ctx.arc(0, 0, baseRadius + 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            ctx.beginPath();
            let points = 60;
            for (let i = 0; i < points; i++) {
                let theta = (i / points) * Math.PI * 2;
                let r = baseRadius + Math.sin(theta * 6 + angle * 3) * (waveIntensity * 30);
                let x = centerX + r * Math.cos(theta);
                let y = centerY + r * Math.sin(theta);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            let grad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, baseRadius + 30);
            grad.addColorStop(0, coreColor);
            grad.addColorStop(0.7, "rgba(0,0,0,0.5)");
            grad.addColorStop(1, "transparent");
            
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = coreColor;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fillStyle = coreColor;
            ctx.shadowColor = coreColor;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            angle += 0.02;
            requestAnimationFrame(drawHologramCore);
        }
        drawHologramCore();

        function setCoreState(state) {
            const canvasElem = document.getElementById("jarvisCanvas");
            if (state === 'ACTIVE') {
                coreColor = "#ff0055"; 
                waveIntensity = 0.5;   
                canvasElem.style.filter = "drop-shadow(0 0 35px rgba(255, 0, 85, 0.9))";
            } else {
                coreColor = "#00f0ff"; 
                waveIntensity = 0.08;  
                canvasElem.style.filter = "drop-shadow(0 0 20px rgba(0, 240, 255, 0.6))";
            }
        }

        function toggleInputSpeech() {
            console.log("MIC 버튼 클릭됨");
            const textMicBtn = document.getElementById("textMicBtn");
            const inputField = document.getElementById("tempInput");

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
                return;
            }

            if (isInputRecording) {
                if (inputRecognition) {
                    try { inputRecognition.stop(); } catch(e) {}
                }
                resetInputMicState();
                return;
            }

            try {
                inputRecognition = new SpeechRecognition();
                inputRecognition.lang = 'ko-KR';
                inputRecognition.interimResults = true;
                inputRecognition.maxAlternatives = 1;

                inputRecognition.onstart = () => {
                    console.log("음성 인식 시작됨");
                    isInputRecording = true;
                    textMicBtn.classList.add('recording');
                    textMicBtn.innerText = "⏹️ STOP";
                    setCoreState('ACTIVE');
                    inputField.placeholder = "듣고 있는 중...";
                };

                inputRecognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        transcript += event.results[i][0].transcript;
                    }
                    if (transcript.trim()) {
                        inputField.value = transcript.trim();
                    }
                };

                inputRecognition.onerror = (e) => {
                    console.error("음성 인식 오류 발생:", e.error);
                    resetInputMicState();
                };

                inputRecognition.onend = () => {
                    console.log("음성 인식 종료됨, 입력값:", inputField.value);
                    isInputRecording = false;
                    textMicBtn.classList.remove('recording');
                    textMicBtn.innerText = "🎤 MIC";
                    inputField.placeholder = "시스템 명령어 입력...";
                    
                    if (inputField.value.trim() !== "") {
                        setTimeout(() => {
                            sendTextCommand();
                        }, 200);
                    } else if (!isProcessing) {
                        setCoreState('IDLE');
                    }
                };

                inputRecognition.start();
            } catch (err) {
                console.error("음성 인식 초기화 실패:", err);
                resetInputMicState();
            }
        }

        function resetInputMicState() {
            isInputRecording = false;
            const textMicBtn = document.getElementById("textMicBtn");
            textMicBtn.classList.remove('recording');
            textMicBtn.innerText = "🎤 MIC";
            const inputField = document.getElementById("tempInput");
            if (inputField) inputField.placeholder = "시스템 명령어 입력...";
            if (!isProcessing) {
                setCoreState('IDLE');
            }
        }

        function speakText(text) {
            if (!window.speechSynthesis) {
                isProcessing = false;
                setCoreState('IDLE');
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            
            utterance.onstart = () => setCoreState('ACTIVE');
            utterance.onend = () => {
                isProcessing = false;
                setCoreState('IDLE');
            };
            utterance.onerror = () => {
                isProcessing = false;
                setCoreState('IDLE');
            };

            window.speechSynthesis.speak(utterance);
        }

        async function fetchToGemma(userQuestion) {
            isProcessing = true;
            setCoreState('ACTIVE');

            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerHTML = "<div>처리 중...</div>";
            
            try {
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: userQuestion })
                });

                if (!response.ok) throw new Error("서버 통신 오류");

                const result = await response.json();
                let rawText = result.choices[0].text;
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                const jsonMatch = rawText.match(/\{.*\}/s);
                if (!jsonMatch) throw new Error("응답 데이터를 찾을 수 없습니다.");
                
                const data = new Function(`return ${jsonMatch[0]}`)();
                
                responseBox.innerHTML = `<div>${data.reply}</div>`;
                
                if (data.reply) {
                    speakText(data.reply);
                } else {
                    isProcessing = false;
                    setCoreState('IDLE');
                }
                
                if (data.status === "OPEN") {
                    setTimeout(() => window.open(data.action, "_blank"), 500);
                }

            } catch (error) {
                console.error("오류 발생:", error);
                responseBox.innerText = "연결 오류 발생";
                isProcessing = false;
                setCoreState('IDLE');
                speakText("연결 오류가 발생했습니다.");
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
