<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        body {
            background-color: #050505; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }
        #jarvis-core-wrapper {
            position: relative; width: 250px; height: 250px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }
        #jarvis-core {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; position: absolute;
            animation: pulse 2s infinite;
        }
        #jarvis-core-inner {
            width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff; animation: spin 10s linear infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #response-box {
            position: absolute; bottom: 160px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.1rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
            max-height: 200px; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        /* 모드 선택 스타일 */
        .mode-container {
            position: absolute; top: 30px; display: flex; gap: 10px; background: rgba(0,240,255,0.1);
            padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(0,240,255,0.3);
        }
        .mode-btn {
            background: transparent; border: none; color: #777; font-weight: bold; cursor: pointer; padding: 5px 10px; font-family: 'Courier New', Courier, monospace;
        }
        .mode-btn.active {
            color: #00f0ff; text-shadow: 0 0 8px #00f0ff;
        }
    </style>
</head>
<body>
    <!-- 상단 모드 선택 스위치 -->
    <div class="mode-container">
        <button id="textModeBtn" class="mode-btn active" onclick="switchMode('text')">💬 텍스트 모드</button>
        <button id="voiceModeBtn" class="mode-btn" onclick="switchMode('voice')">🎤 음성 대화 모드</button>
    </div>

    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="response-box"></div>

    <div style="position: absolute; bottom: 40px; width: 100%; text-align: center;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 50%; max-width: 350px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;">
        <button onclick="sendTextCommand()" style="padding: 12px 20px; margin-left: 8px; background: #00f0ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">전송</button>
        <!-- 음성 모드일 때만 활성화되는 마이크 버튼 -->
        <button id="micBtn" onclick="toggleVoiceInput()" style="display: none; padding: 12px 20px; margin-left: 8px; background: transparent; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px; font-weight: bold; cursor: pointer;">🎤 말하기</button>
    </div>

    <script>
        let currentMode = 'text'; // 기본값은 텍스트 모드

        // 모드 전환 함수
        function switchMode(mode) {
            currentMode = mode;
            const textBtn = document.getElementById("textModeBtn");
            const voiceBtn = document.getElementById("voiceModeBtn");
            const micBtn = document.getElementById("micBtn");
            const inputField = document.getElementById("tempInput");

            if (mode === 'text') {
                textBtn.classList.add('active');
                voiceBtn.classList.remove('active');
                micBtn.style.display = 'none';
                inputField.placeholder = "시스템 명령어 입력...";
            } else {
                voiceBtn.classList.add('active');
                textBtn.classList.remove('active');
                micBtn.style.display = 'inline-block';
                inputField.placeholder = "음성 버튼을 누르고 말씀하세요...";
                if (isListening) stopVoiceInput();
            }
        }

        // 1. 자비스 음성 출력 (TTS) 함수
        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            
            // 음성 대화 모드일 때 자비스가 답변을 마치면 자동으로 마이크를 켜줄 수도 있습니다 (선택사항)
            utterance.onend = () => {
                if (currentMode === 'voice') {
                    // 필요시 답변 완료 후 자동 음성 인식 대기로 연결 가능
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // 2. 자비스 음성 입력 (STT) 함수
        let recognition = null;
        let isListening = false;

        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.");
                return;
            }

            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ko-KR';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;

                recognition.onstart = () => {
                    isListening = true;
                    document.getElementById("micBtn").style.background = "#ff0055";
                    document.getElementById("micBtn").style.color = "#fff";
                    document.getElementById("micBtn").innerText = "🔴 듣고 있는 중...";
                };

                recognition.onresult = (event) => {
                    const speechResult = event.results[0][0].transcript;
                    document.getElementById("tempInput").value = speechResult;
                    sendTextCommand(); // 말하자마자 자동 전송
                };

                recognition.onerror = (event) => {
                    console.error("음성 인식 오류:", event.error);
                };

                recognition.onend = () => {
                    isListening = false;
                    document.getElementById("micBtn").style.background = "transparent";
                    document.getElementById("micBtn").style.color = "#00f0ff";
                    document.getElementById("micBtn").innerText = "🎤 말하기";
                };
            }

            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        async function fetchToGemma(userQuestion) {
            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerHTML = "<div>사고 로직 가동 중...</div>";
            
            try {
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: userQuestion })
                });

                if (!response.ok) throw new Error("서버 통신 오류");

                const result = await response.json();
                
                let rawText = result.choices[0].text;
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                const jsonMatch = rawText.match(/\{.*\}/s);
                if (!jsonMatch) throw new Error("응답에서 데이터를 찾을 수 없습니다.");
                
                const data = new Function(`return ${jsonMatch[0]}`)();
                console.log("최종 파싱 데이터:", data); 

                // 화면 출력
                responseBox.innerHTML = `<div>${data.reply}</div>`;
                
                // 음성 출력은 '음성 대화 모드'일 때만 작동하게 하려면 아래 조건을 걸거나, 항상 읽어주게 할 수 있습니다.
                // 여기서는 음성 모드이거나 사용자가 원할 때 유연하게 작동하도록 설정합니다.
                if (data.reply) {
                    speakText(data.reply);
                }
                
                // 상태 기반 행동 실행
                if (data.status === "OPEN") {
                    setTimeout(() => {
                        window.open(data.action, "_blank");
                    }, 500);
                }

            } catch (error) {
                console.error("오류 발생:", error);
                responseBox.innerText = "연결 오류 발생. 주현아, 백엔드 서버 로그나 콘솔 확인해!";
                speakText("연결 오류가 발생했습니다.");
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
