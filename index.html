<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        /* [UI Rendering] 원형 홀로그램 시각화 (CSS Animation) */
        body {
            background-color: #050505;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #jarvis-core-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }

        #jarvis-core {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff;
            position: absolute;
            animation: pulse 2s infinite;
        }

        #jarvis-core-inner {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff;
            animation: spin 10s linear infinite;
        }

        #status {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #00f0ff;
            margin-top: 30px;
            z-index: 10;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="status">TOUCH TO SYNC SYSTEM</div>

    <div id="text-input-container" style="position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 999;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 60%; max-width: 400px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; font-size: 16px; outline: none; box-shadow: 0 0 10px #00f0ff;">
        <button onclick="sendTextCommand()" 
                style="padding: 12px 24px; margin-left: 10px; background: #00f0ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #00f0ff;">
            전송
        </button>
    </div>

    <script>
        // [System States] 전역 상태 변수 관리
        let renderer = false; 
        let chatHistory = [];         
        let isJarvisSpeaking = false; 

        /* ====================================================================
        [Voice Recognition & Filtering Module]
        - 현재 데모/개발 환경 상 텍스트 입력 모드 테스트를 위해 임시 비활성화 처리
        - Web Audio API를 활용한 특정 사용자(주현) 목소리 주파수 필터링 로직 포함
        ====================================================================
        let recognition;
        let isListening = false;
        let isFirstCall = true;       
        let audioContext;
        let analyser;
        let microphoneStream;
        let isUserVoiceValid = false; 
        */

        // [TTS (Text-to-Speech) Module] 시스템 응답 음성 출력 로직
        function speak(text) {
            /*
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
                isListening = false;
            }
            */

            isJarvisSpeaking = true; 

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';

            utterance.onend = function() {
                isJarvisSpeaking = false; 
                /*
                if (recognition) {
                    try { recognition.start(); isListening = true; } 
                    catch(e) { console.log("[System Log] 마이크 재시작 무시"); }
                }
                */
            };

            window.speechSynthesis.speak(utterance);
        }

        // [LLM Inference Module] 커스텀 백엔드(Hugging Face Docker) 통신 로직
        async function fetchToGemma(userQuestion) {
            try {
                // 시스템 프롬프트: 페르소나 부여 및 논리 추론 지침 세팅
                const systemPrompt = `너는 오직 주인님(주현)만을 위해 작동하는 스마트한 개인 AI 비서 '자비스'다. 다음 지침을 절대적으로 준수하라.
1. [필수 프로토콜] 답변의 첫마디는 무조건 "네, 주인님."으로 시작하라.
2. [논리 추론] 단계별로 차근차근 추론(Step-by-step thinking)하여 가장 최적화된 답변을 제공하라.
3. [정보 무결성] 확실하지 않은 정보는 추측하지 말고 모른다고 명확히 답변하라.`;

                let messages = [{ role: "system", content: systemPrompt }];

                // [Context Management] 최근 대화 히스토리를 큐(Queue) 방식으로 누적하여 문맥 유지
                chatHistory.forEach(chat => {
                    messages.push({ role: "user", content: chat.user });
                    messages.push({ role: "assistant", content: chat.model });
                });

                messages.push({ role: "user", content: userQuestion });

                // 백엔드 엔드포인트 비동기 호출 (REST API POST)
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/v1/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: messages,
                        temperature: 0.4,
                        max_tokens: 512
                    })
                });

                if (!response.ok) throw new Error(`Backend Status: ${response.status}`);

                const result = await response.json();
                let reply = result.choices[0].message.content.trim();

                // 대화 히스토리 메모리 최적화 (최대 5개 유지)
                chatHistory.push({ user: userQuestion, model: reply });
                if (chatHistory.length > 5) chatHistory.shift(); 

                speak(reply);

            } catch (error) {
                console.error("[Error Log] 백엔드 파이프라인 통신 장애:", error);
                speak("네, 주인님. 현재 서버 인프라 연결이 원활하지 않습니다.");
                isJarvisSpeaking = false; 
            }
        }

        /* ====================================================================
        [Audio Analysis & Command Handler] 임시 비활성화
        - startAudioAnalysis(): 실시간 오디오 버퍼 분석 및 특정 대역폭 필터링
        - handleVoiceCommand(): STT 텍스트 파싱 및 커맨드 분기 처리
        ====================================================================
        */

        // [Event Handler] 시스템 렌더링 초기화
        document.body.onclick = async (event) => {
            // [Event Bubbling 防禦] 텍스트 입력창 클릭 시 백그라운드 이벤트 트리거 방지
            if(event.target.closest('#text-input-container')) return;

            if (!renderer) {
                initJarvis(); 
                document.getElementById('status').innerText = "SYSTEM ONLINE (TEXT MODE)";
            }
            
            /*
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                ... (중략) ...
            } catch(e) {
                console.error("[System Log] 마이크 매핑 실패:", e);
            }
            */
        };

        // [Visualization] 3D 코어 활성화
        function initJarvis() {
            console.log("[System Log] 3D Core Rendering Activated...");
            renderer = true; 
        }

        // [Input Handler] 텍스트 명령 백엔드 전송
        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            const text = inputField.value.trim();
            
            if (!text) return; // 예외 처리: 빈 문자열 방어
            
            console.log("[Data Transmission] Payload:", text);
            
            inputField.value = ""; // 폼 초기화
            fetchToGemma(text); // 추론 모듈로 데이터 파이프라이닝
        }

        // [Event Listener] 엔터키 전송 지원
        document.getElementById("tempInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendTextCommand();
            }
        });

    </script>
</body>
</html>
