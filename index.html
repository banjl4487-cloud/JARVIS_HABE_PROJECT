<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        body {
            background-color: #050505;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        #jarvis-core-wrapper {
            position: relative; width: 250px; height: 250px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }

        #jarvis-core {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; position: absolute;
            animation: pulse 2s infinite;
        }

        #jarvis-core-inner {
            width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff; animation: spin 10s linear infinite;
        }

        #status { font-size: 1.2rem; letter-spacing: 3px; text-shadow: 0 0 10px #00f0ff; margin-top: 30px; z-index: 10; }

        @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.8; } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* 자비스 응답 출력창 */
        #response-box {
            position: absolute;
            bottom: 120px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            z-index: 999;
            display: none;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="status">TOUCH TO SYNC SYSTEM</div>

    <div id="response-box"></div>

    <div id="text-input-container" style="position: absolute; bottom: 40px; width: 100%; text-align: center; z-index: 999;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 60%; max-width: 400px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; font-size: 16px; outline: none; box-shadow: 0 0 10px #00f0ff;">
        <button onclick="sendTextCommand()" 
                style="padding: 12px 24px; margin-left: 10px; background: #00f0ff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px #00f0ff;">
            전송
        </button>
    </div>

    <script>
        let renderer = false; 
        let chatHistory = [];         

        // [확장 대비 모듈화] 물리 환경에 따라 로직 교체 가능
        const JarvisModule = {
            output: (text) => {
                const box = document.getElementById("response-box");
                box.style.display = "block";
                box.innerText = text;
            },
            // 현재는 소리 출력 불가능한 환경이므로 비워둠
            speak: (text) => {
                console.log("TTS 모듈 비활성 상태: ", text);
            }
        };

        async function fetchToGemma(userQuestion) {
            JarvisModule.output("데이터 추론 중...");
            
            try {
                const systemPrompt = "너는 주인님(주현)을 위한 자비스다. 논리적으로 답변하라.";
                let messages = [{ role: "system", content: systemPrompt }];

                chatHistory.forEach(chat => {
                    messages.push({ role: "user", content: chat.user });
                    messages.push({ role: "assistant", content: chat.model });
                });

                messages.push({ role: "user", content: userQuestion });

                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: messages,
                        temperature: 0.4,
                        max_tokens: 512,
                        stream: false
                    })
                });

                if (!response.ok) throw new Error(`서버 응답 실패: ${response.status}`);

                const result = await response.json();
                let reply = result.choices[0].message.content.trim();

                chatHistory.push({ user: userQuestion, model: reply });
                if (chatHistory.length > 5) chatHistory.shift(); 

                JarvisModule.output(reply);
                JarvisModule.speak(reply);

            } catch (error) {
                console.error("통신 에러:", error);
                JarvisModule.output("연결 오류가 발생했습니다.");
            }
        }

        document.body.onclick = (event) => {
            if(event.target.closest('#text-input-container')) return;
            if (!renderer) {
                renderer = true;
                document.getElementById('status').innerText = "SYSTEM ONLINE (TEXT MODE)";
            }
        };

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            const text = inputField.value.trim();
            if (!text) return; 
            inputField.value = ""; 
            fetchToGemma(text); 
        }

        document.getElementById("tempInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendTextCommand();
        });
    </script>
</body>
</html>
