<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        body {
            background-color: #050505;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #jarvis-core-wrapper {
            position: relative; width: 250px; height: 250px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }

        #jarvis-core {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; position: absolute;
            animation: pulse 2s infinite;
        }

        #jarvis-core-inner {
            width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff; animation: spin 10s linear infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #response-box {
            position: absolute; bottom: 120px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.2rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.1); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
        }
    </style>
</head>
<body>

    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>

    <div id="response-box"></div>

    <div style="position: absolute; bottom: 40px; width: 100%; text-align: center;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 60%; max-width: 400px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;">
        <button onclick="sendTextCommand()" style="padding: 12px 24px; margin-left: 10px; background: #00f0ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">전송</button>
    </div>

    <script>
        let chatHistory = [];         

        async function fetchToGemma(userQuestion) {
            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerText = "분석 중...";
            
            try {
                // 시스템 프롬프트 설정 (페르소나 유지)
                const systemPrompt = "너는 자비스다. 주인님(주현)에게 예의 바르고 명확하게 답변하라.";
                let messages = [{ role: "system", content: systemPrompt }];
                chatHistory.forEach(c => messages.push({ role: "user", content: c.user }, { role: "assistant", content: c.model }));
                messages.push({ role: "user", content: userQuestion });

                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: messages,
                        temperature: 0.7,          // 자연스러운 대화를 위해 0.7
                        max_tokens: 300,           // 충분한 답변 길이
                        repeat_penalty: 1.15,      // 반복 방지
                        presence_penalty: 0.1,     // 새로운 내용 유도
                        frequency_penalty: 0.1,    // 중복 단어 방지
                        stream: false
                    })
                });

                if (!response.ok) throw new Error("서버 응답 오류");

                const result = await response.json();
                let reply = result.choices[0].message.content.trim();

                chatHistory.push({ user: userQuestion, model: reply });
                if (chatHistory.length > 3) chatHistory.shift(); 

                responseBox.innerText = reply;
            } catch (error) {
                responseBox.innerText = "연결 오류 발생. 서버 확인 필요.";
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
