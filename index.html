<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        body {
            background-color: #050505; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }
        #jarvis-core-wrapper {
            position: relative; width: 250px; height: 250px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
            transition: all 0.3s ease;
        }
        #jarvis-core {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; position: absolute;
            animation: pulse 2s infinite;
        }
        #jarvis-core-inner {
            width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff; animation: spin 10s linear infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #response-box {
            position: absolute; bottom: 160px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.1rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
            max-height: 200px; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .mode-container {
            position: absolute; top: 30px; display: flex; gap: 10px; background: rgba(0,240,255,0.1);
            padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(0,240,255,0.3);
        }
        .mode-btn {
            background: transparent; border: none; color: #777; font-weight: bold; cursor: pointer; padding: 5px 10px; font-family: 'Courier New', Courier, monospace;
        }
        .mode-btn.active {
            color: #00f0ff; text-shadow: 0 0 8px #00f0ff;
        }
    </style>
</head>
<body>
    <div class="mode-container">
        <button id="textModeBtn" class="mode-btn active" onclick="switchMode('text')">💬 텍스트 모드</button>
        <button id="voiceModeBtn" class="mode-btn" onclick="switchMode('voice')">🎤 음성 대화 모드</button>
    </div>

    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="response-box"></div>

    <div style="position: absolute; bottom: 40px; width: 100%; text-align: center;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 50%; max-width: 350px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;">
        <button id="sendBtn" onclick="sendTextCommand()" style="padding: 12px 20px; margin-left: 8px; background: #00f0ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">전송</button>
        <button id="micBtn" onclick="toggleVoiceInput()" style="display: none; padding: 12px 24px; background: transparent; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">음성 인식 수동 재시작</button>
    </div>

    <script>
        let currentMode = 'text';
        let recognition = null;
        let isListening = false;
        
        let audioContext = null;
        let mediaStreamSource = null;
        let highPassFilter = null;
        let voiceBoostFilter = null;
        let isWakeUpActive = false;

        function switchMode(mode) {
            currentMode = mode;
            const textBtn = document.getElementById("textModeBtn");
            const voiceBtn = document.getElementById("voiceModeBtn");
            const micBtn = document.getElementById("micBtn");
            const inputField = document.getElementById("tempInput");
            const sendBtn = document.getElementById("sendBtn");

            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (recognition && isListening) {
                recognition.stop();
            }
            stopVoiceSystem();

            if (mode === 'text') {
                textBtn.classList.add('active');
                voiceBtn.classList.remove('active');
                inputField.style.display = 'inline-block';
                sendBtn.style.display = 'inline-block';
                micBtn.style.display = 'none';
                setCoreState('IDLE');
            } else {
                voiceBtn.classList.add('active');
                textBtn.classList.remove('active');
                inputField.style.display = 'none';
                sendBtn.style.display = 'none';
                micBtn.style.display = 'inline-block';
                
                startVoiceSystem();
                setTimeout(() => {
                    startWakeUpListening();
                }, 500);
            }
        }

        // 🎨 코어 시각 상태 제어 함수 (IDLE: 파랑 / LISTENING: 초록 / TRIGGERED: 빨강)
        function setCoreState(state) {
            const core = document.getElementById("jarvis-core");
            const coreInner = document.getElementById("jarvis-core-inner");
            const wrapper = document.getElementById("jarvis-core-wrapper");

            if (state === 'LISTENING') {
                core.style.borderColor = "#00ff66";
                core.style.boxShadow = "0 0 20px #00ff66, inset 0 0 15px #00ff66";
                coreInner.style.borderColor = "#00ff66";
                wrapper.style.filter = "drop-shadow(0 0 25px #00ff66)";
            } else if (state === 'TRIGGERED') {
                core.style.borderColor = "#ff0055";
                core.style.boxShadow = "0 0 25px #ff0055, inset 0 0 20px #ff0055";
                coreInner.style.borderColor = "#ff0055";
                wrapper.style.filter = "drop-shadow(0 0 35px #ff0055)";
            } else {
                // IDLE
                core.style.borderColor = "#00f0ff";
                core.style.boxShadow = "0 0 15px #00f0ff, inset 0 0 15px #00f0ff";
                coreInner.style.borderColor = "#00f0ff";
                wrapper.style.filter = "drop-shadow(0 0 20px #00f0ff)";
            }
        }

        async function startVoiceSystem() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStreamSource = audioContext.createMediaStreamSource(stream);

                highPassFilter = audioContext.createBiquadFilter();
                highPassFilter.type = "highpass";
                highPassFilter.frequency.setValueAtTime(300, audioContext.currentTime);

                voiceBoostFilter = audioContext.createBiquadFilter();
                voiceBoostFilter.type = "peaking";
                voiceBoostFilter.frequency.setValueAtTime(1500, audioContext.currentTime);
                voiceBoostFilter.Q.setValueAtTime(1.0, audioContext.currentTime);
                voiceBoostFilter.gain.setValueAtTime(5.0, audioContext.currentTime);

                mediaStreamSource.connect(highPassFilter);
                highPassFilter.connect(voiceBoostFilter);

                isWakeUpActive = true;
            } catch (e) {
                console.error("오디오 시스템 초기화 실패:", e);
            }
        }

        function stopVoiceSystem() {
            isWakeUpActive = false;
            setCoreState('IDLE');
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.suspend();
            }
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            
            utterance.onend = () => {
                if (currentMode === 'voice' && !isListening) {
                    setTimeout(() => {
                        startWakeUpListening();
                    }, 500);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function initWakeUpRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다.");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'ko-KR';
            rec.interimResults = true;
            rec.continuous = true;     

            rec.onstart = () => {
                isListening = true;
                // 🟢 음성 인식이 정상 작동 중일 때 초록색 불빛으로 변경
                setCoreState('LISTENING');
            };

            rec.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                
                document.getElementById("tempInput").value = transcript;
                
                if (transcript.includes("자비스") && !window.jarvisTriggered) {
                    window.jarvisTriggered = true;
                    setCoreState('TRIGGERED'); // 🔴 트리거 감지 시 빨간색 불빛
                    fetchToGemma(transcript);
                }
            };

            rec.onerror = (event) => {
                console.error("음성 인식 오류:", event.error);
                isListening = false;
                setCoreState('IDLE');
            };

            rec.onend = () => {
                isListening = false;
                window.jarvisTriggered = false;
                
                const completeText = document.getElementById("tempInput").value.trim();
                if (completeText && currentMode === 'voice') {
                    document.getElementById("tempInput").value = "";
                    fetchToGemma(completeText);
                } else if (currentMode === 'voice' && isWakeUpActive) {
                    setCoreState('IDLE');
                    setTimeout(() => {
                        startWakeUpListening();
                    }, 400);
                }
            };

            return rec;
        }

        function startWakeUpListening() {
            if (currentMode !== 'voice' || !isWakeUpActive) return;
            if (!recognition) {
                recognition = initWakeUpRecognition();
                if (!recognition) return;
            }
            if (!isListening) {
                try {
                    window.jarvisTriggered = false;
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function toggleVoiceInput() {
            if (isListening) {
                if (recognition) recognition.stop();
            } else {
                startWakeUpListening();
            }
        }

        async function fetchToGemma(userQuestion) {
            if (recognition && isListening) {
                recognition.stop();
            }

            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerHTML = "<div>처리 중...</div>";
            
            try {
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: userQuestion })
                });

                if (!response.ok) throw new Error("서버 통신 오류");

                const result = await response.json();
                let rawText = result.choices[0].text;
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                const jsonMatch = rawText.match(/\{.*\}/s);
                if (!jsonMatch) throw new Error("응답 데이터를 찾을 수 없습니다.");
                
                const data = new Function(`return ${jsonMatch[0]}`)();
                
                responseBox.innerHTML = `<div>${data.reply}</div>`;
                if (data.reply) {
                    speakText(data.reply);
                }
                
                if (data.status === "OPEN") {
                    setTimeout(() => {
                        window.open(data.action, "_blank");
                    }, 500);
                }

            } catch (error) {
                console.error("오류 발생:", error);
                responseBox.innerText = "연결 오류 발생";
                speakText("연결 오류가 발생했습니다.");
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
