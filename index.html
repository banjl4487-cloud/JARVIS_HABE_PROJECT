<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        body {
            background-color: #050505; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }
        #jarvis-core-wrapper {
            position: relative; width: 250px; height: 250px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }
        #jarvis-core {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; position: absolute;
            animation: pulse 2s infinite;
        }
        #jarvis-core-inner {
            width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff; animation: spin 10s linear infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #response-box {
            position: absolute; bottom: 140px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.1rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
            max-height: 200px; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .btn-group {
            margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
        }
        .action-btn {
            background: rgba(0, 240, 255, 0.2); border: 1px solid #00f0ff; color: #00f0ff;
            padding: 8px 16px; border-radius: 5px; font-family: inherit; font-weight: bold;
            cursor: pointer; transition: all 0.3s;
        }
        .action-btn:hover {
            background: #00f0ff; color: #050505; box-shadow: 0 0 10px #00f0ff;
        }
    </style>
</head>
<body>
    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="response-box"></div>

    <div style="position: absolute; bottom: 40px; width: 100%; text-align: center;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 60%; max-width: 400px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;">
        <button onclick="sendTextCommand()" style="padding: 12px 24px; margin-left: 10px; background: #00f0ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">전송</button>
    </div>

    <script>
        let chatHistory = [];          

        // 백엔드 라우터 연동 및 출력 제어 파이프라인
        async function fetchToGemma(userQuestion) {
            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerHTML = "<div>사고 로직 가동 중...</div>";
            
            try {
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        query: userQuestion,
                        history: chatHistory
                    })
                });

                if (!response.ok) throw new Error("서버 통신 오류");

                const result = await response.json();
                const { status, reply, targetSite, options } = result;

                // 1. 자비스 응답 텍스트 출력
                responseBox.innerHTML = `<div>${reply}</div>`;

                // 2. 컨텍스트 히스토리 관리 (최근 3개 세션 유지)
                chatHistory.push({ user: userQuestion, model: reply });
                if (chatHistory.length > 3) chatHistory.shift(); 

                // 3. 백엔드 상태 판정 플래그 기반 행동 분기 제어
                if (status === "OPEN" && targetSite) {
                    // 사이트 오픈 가로채기 및 구글 I'm Feeling Lucky 라우팅
                    setTimeout(() => {
                        window.open(`https://www.google.com/search?q=${targetSite}&btnI=I`, "_blank");
                    }, 600);
                } 
                else if (status === "AMBIGUOUS" && options) {
                    // 판단 미스 위험 구간 진입 시 사용자 인터랙션 버튼 렌더링
                    const btnGroup = document.createElement("div");
                    btnGroup.className = "btn-group";

                    options.forEach(opt => {
                        const btn = document.createElement("button");
                        btn.className = "action-btn";
                        btn.innerText = opt;
                        btn.onclick = () => {
                            fetchToGemma(`${userQuestion} -> ${opt} 방향으로 실행해줘`);
                        };
                        btnGroup.appendChild(btn);
                    });
                    responseBox.appendChild(btnGroup);
                }

            } catch (error) {
                responseBox.innerText = "연결 오류 발생. 라우터 서버 및 네트워크 상태를 확인하십시오.";
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
