<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - Hologram Core</title>
    <style>
        body {
            background-color: #030712; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }
        
        #jarvis-container {
            position: relative; width: 300px; height: 300px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
        }

        #jarvisCanvas {
            position: absolute; width: 100%; height: 100%;
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.6));
            transition: filter 0.3s ease;
        }
        
        #response-box {
            position: absolute; bottom: 180px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.1rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
            max-height: 200px; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .mode-container {
            position: absolute; top: 30px; display: flex; gap: 10px; background: rgba(0,240,255,0.1);
            padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(0,240,255,0.3);
        }
        .mode-btn {
            background: transparent; border: none; color: #777; font-weight: bold; cursor: pointer; padding: 5px 10px; font-family: 'Courier New', Courier, monospace;
        }
        .mode-btn.active {
            color: #00f0ff; text-shadow: 0 0 8px #00f0ff;
        }

        .control-panel {
            position: absolute; bottom: 40px; width: 100%; text-align: center; display: flex; justify-content: center; gap: 10px; align-items: center;
        }

        .cyber-btn {
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            border: 1px solid #00f0ff;
            padding: 12px 20px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }
        .cyber-btn:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="mode-container">
        <button id="textModeBtn" class="mode-btn active" onclick="switchMode('text')">💬 텍스트 모드</button>
        <button id="voiceModeBtn" class="mode-btn" onclick="switchMode('voice')">🎤 음성 대화 모드</button>
    </div>

    <div id="jarvis-container">
        <canvas id="jarvisCanvas" width="300" height="300"></canvas>
    </div>

    <div id="response-box"></div>

    <div class="control-panel">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 40%; max-width: 350px; border-radius: 4px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;">
        <button id="sendBtn" onclick="sendTextCommand()" class="cyber-btn" style="background: #00f0ff; color: #030712;">전송</button>
        <button id="micBtn" onclick="toggleManualVoice()" class="cyber-btn" style="display: none;">MIC MANUAL</button>
    </div>

    <script>
        let currentMode = 'text';
        let recognition = null;
        let isListening = false;
        
        let audioContext = null;
        let mediaStreamSource = null;
        let highPassFilter = null;
        let voiceBoostFilter = null;
        let isWakeUpActive = false;
        let isManualActive = false;
        let silenceTimer = null; // ⏱️ 2~3초 침묵 감지용 타이머

        const canvas = document.getElementById("jarvisCanvas");
        const ctx = canvas.getContext("2d");
        let coreColor = "#00f0ff"; 
        let waveIntensity = 0.05;  
        let angle = 0;

        function drawHologramCore() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;
            let baseRadius = 75;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle);
            ctx.strokeStyle = coreColor;
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 15]);
            ctx.beginPath();
            ctx.arc(0, 0, baseRadius + 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();

            ctx.beginPath();
            let points = 60;
            for (let i = 0; i < points; i++) {
                let theta = (i / points) * Math.PI * 2;
                let r = baseRadius + Math.sin(theta * 6 + angle * 3) * (waveIntensity * 30);
                let x = centerX + r * Math.cos(theta);
                let y = centerY + r * Math.sin(theta);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            
            let grad = ctx.createRadialGradient(centerX, centerY, 10, centerX, centerY, baseRadius + 30);
            grad.addColorStop(0, coreColor);
            grad.addColorStop(0.7, "rgba(0,0,0,0.5)");
            grad.addColorStop(1, "transparent");
            
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = coreColor;
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
            ctx.fillStyle = coreColor;
            ctx.shadowColor = coreColor;
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            angle += 0.02;
            requestAnimationFrame(drawHologramCore);
        }
        drawHologramCore();

        function setCoreState(state) {
            const canvasElem = document.getElementById("jarvisCanvas");
            if (state === 'ACTIVE') {
                coreColor = "#ff0055"; 
                waveIntensity = 0.5;   
                canvasElem.style.filter = "drop-shadow(0 0 35px rgba(255, 0, 85, 0.9))";
            } else {
                coreColor = "#00f0ff"; 
                waveIntensity = 0.08;  
                canvasElem.style.filter = "drop-shadow(0 0 20px rgba(0, 240, 255, 0.6))";
            }
        }

        function switchMode(mode) {
            currentMode = mode;
            const textBtn = document.getElementById("textModeBtn");
            const voiceBtn = document.getElementById("voiceModeBtn");
            const micBtn = document.getElementById("micBtn");
            const inputField = document.getElementById("tempInput");
            const sendBtn = document.getElementById("sendBtn");

            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (silenceTimer) clearTimeout(silenceTimer);
            
            if (recognition) {
                try { recognition.stop(); } catch(e){}
                recognition = null;
            }
            isListening = false;
            isManualActive = false;
            stopVoiceSystem();
            setCoreState('IDLE');

            if (mode === 'text') {
                textBtn.classList.add('active');
                voiceBtn.classList.remove('active');
                inputField.style.display = 'inline-block';
                sendBtn.style.display = 'inline-block';
                micBtn.style.display = 'none';
            } else {
                voiceBtn.classList.add('active');
                textBtn.classList.remove('active');
                inputField.style.display = 'none';
                sendBtn.style.display = 'none';
                micBtn.style.display = 'inline-block';
                micBtn.innerText = "MIC MANUAL";
                
                startVoiceSystem();
                setTimeout(() => startAutoWakeUp(), 500);
            }
        }

        async function startVoiceSystem() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') await audioContext.resume();

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStreamSource = audioContext.createMediaStreamSource(stream);

                highPassFilter = audioContext.createBiquadFilter();
                highPassFilter.type = "highpass";
                highPassFilter.frequency.setValueAtTime(300, audioContext.currentTime);

                voiceBoostFilter = audioContext.createBiquadFilter();
                voiceBoostFilter.type = "peaking";
                voiceBoostFilter.frequency.setValueAtTime(1500, audioContext.currentTime);
                voiceBoostFilter.Q.setValueAtTime(1.0, audioContext.currentTime);
                voiceBoostFilter.gain.setValueAtTime(5.0, audioContext.currentTime);

                mediaStreamSource.connect(highPassFilter);
                highPassFilter.connect(voiceBoostFilter);

                isWakeUpActive = true;
            } catch (e) {
                console.error("오디오 시스템 초기화 실패:", e);
            }
        }

        function stopVoiceSystem() {
            isWakeUpActive = false;
            if (silenceTimer) clearTimeout(silenceTimer);
            setCoreState('IDLE');
            if (audioContext && audioContext.state !== 'closed') audioContext.suspend();
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            
            utterance.onstart = () => setCoreState('ACTIVE');
            utterance.onend = () => {
                isManualActive = false;
                setCoreState('IDLE');
                document.getElementById("micBtn").innerText = "MIC MANUAL";
                if (currentMode === 'voice' && isWakeUpActive) {
                    setTimeout(() => startAutoWakeUp(), 500);
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // 🤖 자동 모드 ("자비스" 감지 후 2~3초 침묵 시 자동 종료 및 전송)
        function startAutoWakeUp() {
            if (currentMode !== 'voice' || !isWakeUpActive || isManualActive || isListening) return;

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.interimResults = true;
            recognition.continuous = true;     

            recognition.onstart = () => {
                isListening = true;
                setCoreState('IDLE');
            };

            recognition.onresult = (event) => {
                if (isManualActive) return;
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                
                // 1단계: "자비스" 웨이크 워드 감지
                if (transcript.includes("자비스")) {
                    setCoreState('ACTIVE'); // 🔴 빨간색 전환
                    
                    // ⏱️ 2.5초 동안 추가 음성 입력이 없으면 말을 마친 것으로 판단
                    if (silenceTimer) clearTimeout(silenceTimer);
                    silenceTimer = setTimeout(() => {
                        recognition.stop();
                        fetchToGemma(transcript);
                    }, 2500); // 2.5초 침묵 대기
                }
            };

            recognition.onerror = () => {
                isListening = false;
                setCoreState('IDLE');
            };

            recognition.onend = () => {
                isListening = false;
                if (currentMode === 'voice' && isWakeUpActive && !isManualActive) {
                    setTimeout(() => startAutoWakeUp(), 400);
                }
            };

            try {
                recognition.start();
            } catch (e) {
                isListening = false;
            }
        }

        // 🖱️ 수동 모드 (버튼 클릭으로 시작, 재클릭 전까지 락 유지)
        function toggleManualVoice() {
            if (isManualActive) {
                isManualActive = false;
                if (silenceTimer) clearTimeout(silenceTimer);
                if (recognition) {
                    try { recognition.stop(); } catch(e){}
                }
                document.getElementById("micBtn").innerText = "MIC MANUAL";
                setCoreState('IDLE');
                if (currentMode === 'voice' && isWakeUpActive) startAutoWakeUp();
                return;
            }

            isManualActive = true;
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            setCoreState('ACTIVE');
            document.getElementById("micBtn").innerText = "LISTENING (LOCKED)";

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("음성 인식을 지원하지 않는 브라우저입니다.");
                isManualActive = false;
                setCoreState('IDLE');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.interimResults = false;
            recognition.continuous = false;

            recognition.onresult = (event) => {
                if (!isManualActive) return;
                let transcript = event.results[0][0].transcript.trim();
                
                if (transcript.length < 2) {
                    isManualActive = false;
                    setCoreState('IDLE');
                    document.getElementById("micBtn").innerText = "MIC MANUAL";
                    return;
                }

                fetchToGemma(transcript);
            };

            recognition.onerror = () => {
                isListening = false;
                isManualActive = false;
                setCoreState('IDLE');
                document.getElementById("micBtn").innerText = "MIC MANUAL";
            };

            recognition.onend = () => {
                isListening = false;
            };

            try {
                recognition.start();
            } catch (e) {
                isListening = false;
                isManualActive = false;
                setCoreState('IDLE');
                document.getElementById("micBtn").innerText = "MIC MANUAL";
            }
        }

        async function fetchToGemma(userQuestion) {
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
            if (silenceTimer) clearTimeout(silenceTimer);

            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerHTML = "<div>처리 중...</div>";
            
            try {
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: userQuestion })
                });

                if (!response.ok) throw new Error("서버 통신 오류");

                const result = await response.json();
                let rawText = result.choices[0].text;
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                const jsonMatch = rawText.match(/\{.*\}/s);
                if (!jsonMatch) throw new Error("응답 데이터를 찾을 수 없습니다.");
                
                const data = new Function(`return ${jsonMatch[0]}`)();
                
                responseBox.innerHTML = `<div>${data.reply}</div>`;
                if (data.reply) {
                    speakText(data.reply);
                } else {
                    isManualActive = false;
                    setCoreState('IDLE');
                    document.getElementById("micBtn").innerText = "MIC MANUAL";
                }
                
                if (data.status === "OPEN") {
                    setTimeout(() => window.open(data.action, "_blank"), 500);
                }

            } catch (error) {
                console.error("오류 발생:", error);
                responseBox.innerText = "연결 오류 발생";
                speakText("연결 오류가 발생했습니다.");
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
