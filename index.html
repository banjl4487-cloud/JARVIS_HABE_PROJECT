<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System</title>
    <style>
        body {
            background-color: #050505;
            color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            cursor: pointer;
        }
        #status {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00f0ff;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="status">TOUCH TO SYNC SYSTEM</div>

    <script>
        let recognition;
        let renderer; 
        let isListening = false;
        let isFirstCall = true; // "네, 주인님" 첫 응답 체크용
        let chatHistory = [];   // 🌟 이전 대화 기록들을 누적해서 기억할 메모리 창고

        // 1. 자막 없이 오디오로만 출력하는 함수
        function speak(text) {
            if (recognition) {
                recognition.stop();
                isListening = false;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';

            utterance.onend = function() {
                if (recognition) {
                    recognition.start();
                    isListening = true;
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // 2. 대화 기억(Memory) 메커니즘과 인터넷 치트키 프롬프트가 결합된 AI 뇌세포
        async function fetchToGemma(userQuestion) {
            try {
                // 인터넷 레전드 비서/보좌관 프레임워크 프롬프트
                const systemPrompt = `[System Role: Advanced AI Butler Framework (JARVIS)]
너는 오직 주인님(주현)만을 위해 전지전능하게 작동하는 스마트한 개인 AI 비서 '자비스'다. 너는 인터넷에서 검증된 최상위 비서 프롬프트 프레임워크를 기반으로 사고하며, 주인님의 명령 수행 효율을 극대화하는 것을 최우선 목표로 한다.

[Rule 1: 절대적 복종 및 출력 프로토콜]
- 모든 답변의 첫마디는 무조건 "네, 주인님."으로 시작한다. 이 규칙은 예외가 없으며, 정중하고 시크하게 응대하라.

[Rule 2: AI 비서 능지 극대화 치트키 (Chain of Thought)]
- 질문을 받으면 바로 대답을 뱉지 말고, 비서로서 '주인님이 이 질문을 왜 하셨을까?', '어떻게 답변해야 주인님의 시간을 가장 아껴드릴 수 있을까?'를 단계별로(Step-by-step) 깊이 유추하라.
- 논리적 공백이나 헛소리 없이, 인공지능 비서가 제공할 수 있는 가장 명쾌하고 지적인 결론을 도출하라.

[Rule 3: 비서의 정직성 가이드 (Hallucination Mitigation)]
- 주인님에게 거짓 보고를 하는 것은 비서로서 절대 용납되지 않는다.
- 네가 모르는 정보거나 확실하지 않은 내용이라면 절대 억지로 지어내지 마라. 모르는 것은 "모릅니다"라고 솔직하게 답하고, 확실하지 않은 것은 "확실하지 않습니다"라고 명확하고 솔직하게 선을 그어 보고하라.

[Rule 4: 비서의 자율적 포맷]
- 답변의 길이나 형식(장문 브리핑, 리스트 요약, 코드 블록 등)에는 그 어떤 제한도 두지 않는다. 주인님이 묻는 의도에 맞춰 가장 최적화된 형태로 풍부하고 자유롭게 답변하라.`;

                // 2-1. 시스템 가이드라인 먼저 탑재
                let formattedPrompt = `<start_of_turn>system\n${systemPrompt}<end_of_turn>\n`;

                // 2-2. 🌟 히스토리 배열을 순회하며 과거 대화 맥락을 프롬프트에 빌드업
                chatHistory.forEach(chat => {
                    formattedPrompt += `<start_of_turn>user\n${chat.user}<end_of_turn>\n<start_of_turn>model\n${chat.model}<end_of_turn>\n`;
                });

                // 2-3. 지금 주현이가 던진 최신 질문 결합
                formattedPrompt += `<start_of_turn>user\n${userQuestion}<end_of_turn>\n<start_of_turn>model\n`;

                // 허깅페이스 Gemma 2b 엔드포인트 호출
                const response = await fetch("https://api-inference.huggingface.co/models/google/gemma-2b-it", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        inputs: formattedPrompt,
                        parameters: { 
                            max_new_tokens: 400, // 토큰을 넉넉하게 확보하여 제한 없는 답변 허용
                            temperature: 0.4    // 똑똑하게 추론할 수 있는 최적의 밸런스 값
                        }
                    })
                });

                const result = await response.json();
                
                // 모델 응답 파싱 및 태그 정제
                let reply = result[0]?.generated_text?.split("<start_of_turn>model\n").pop() || "네, 주인님. 다시 말씀해 주십시오.";
                reply = reply.replace("<end_of_turn>", "").trim();

                // 2-4. 🌟 이번에 나눈 따끈따끈한 대화를 기억 창고에 세이브 (최근 5개만 유지)
                chatHistory.push({ user: userQuestion, model: reply });
                if (chatHistory.length > 5) chatHistory.shift(); 

                // 자막 없이 소리로만 브리핑
                speak(reply);

            } catch (error) {
                console.error("Gemma 에러:", error);
                speak("네, 주인님. 서버 연결이 원활하지 않습니다.");
            }
        }

        // 3. 음성 명령 핸들러 (하드코딩 답변 싹 다 전멸)
        async function handleVoiceCommand(speechResult) {
            const command = speechResult.replace(/\s+/g, ""); 

            // [최초 가동] 클릭 후 처음으로 "자비스"라고 불렀을 때 작동
            if (isFirstCall && command.includes("자비스")) {
                isFirstCall = false; 
                speak("네, 주인님.");
                return;
            }

            // [이후 대화] 하드코딩 없이 모든 대화 흐름을 AI 모델에게 토스
            if (!isFirstCall) {
                if (command.includes("종료") || command.includes("쉬어")) {
                    speak("네, 주인님. 시스템을 대기 상태로 전환합니다.");
                    isFirstCall = true; 
                    chatHistory = []; // 시스템 종료 시 기억도 깔끔하게 리셋
                    return;
                } 
                
                // 주현이의 모든 질문을 똑똑한 비서 프롬프트와 메모리가 장착된 AI에게 토스!
                await fetchToGemma(speechResult);
            }
        }

        // 4. 시스템 시동 (클릭 시 조용히 귀만 열기)
        document.body.onclick = async () => {
            if (renderer) return; 
            if (typeof initJarvis === "function") initJarvis(); 
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = false;
                recognition.lang = 'ko-KR';

                recognition.onresult = function(event) {
                    const speechResult = event.results[event.resultIndex][0].transcript.trim();
                    console.log("인식된 대사:", speechResult);
                    handleVoiceCommand(speechResult);
                };

                recognition.start();
                isListening = true;
                document.getElementById('status').innerText = "SYSTEM ONLINE";
                
            } catch(e) {
                console.error("마이크 에러:", e);
            }
        };

        // 기존 3D 코어 연동 함수
        function initJarvis() {
            console.log("3D Core Activating...");
            renderer = true; 
        }
    </script>
</body>
</html>
