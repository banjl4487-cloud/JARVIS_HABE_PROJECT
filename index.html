<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS: HABE PROJECT</title>
    <style>
        body { margin: 0; background: #000205; overflow: hidden; font-family: 'Segoe UI', sans-serif; cursor: pointer; }
        
        /* R&D 격자 배경 */
        #grid-bg {
            position: fixed; width: 100vw; height: 100vh;
            background-image: linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -1;
        }

        #container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 외부 회전 인터페이스 링 */
        #ui-ring {
            position: absolute; width: 320px; height: 320px;
            border: 1px dashed rgba(0, 212, 255, 0.2); border-radius: 50%;
            animation: spin 20s linear infinite; transition: all 0.5s ease;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        #status { color: #00d4ff; letter-spacing: 5px; font-size: 11px; margin-top: 40px; opacity: 0.6; font-weight: bold; text-transform: uppercase; }
        #log { color: #ffffff; font-size: 1.3rem; margin-top: 15px; text-align: center; max-width: 85%; text-shadow: 0 0 15px rgba(0, 212, 255, 0.8); font-weight: 300; }
        
        .active-ring { border-color: rgba(0, 212, 255, 0.8) !important; box-shadow: 0 0 30px rgba(0, 212, 255, 0.2); }
    </style>
</head>
<body>
    <div id="grid-bg"></div>
    <div id="container">
        <div id="ui-ring"></div>
        <div id="canvas-container"></div>
        <div id="status">Neural Link: Standby</div>
        <div id="log">화면을 클릭하여 시스템을 동기화하세요.</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // [연결] 주현이의 허깅페이스 엔드포인트
        const HF_ENDPOINT = "https://banjl4487-jarvis-habe-project.hf.space/completion";
        
        let analyzer, dataArray, core, scene, camera, renderer;
        let isListening = false;

        // 1. [Visual] 3D 에너지 코어 생성
        function initJarvisCore() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(400, 400);
            document.getElementById('canvas-container').innerHTML = '';
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geometry = new THREE.IcosahedronGeometry(1.3, 4);
            const material = new THREE.MeshPhongMaterial({
                color: 0x00d4ff, emissive: 0x00d4ff, emissiveIntensity: 1.5,
                wireframe: true, transparent: true, opacity: 0.7
            });
            core = new THREE.Mesh(geometry, material);
            scene.add(core);

            const light = new THREE.PointLight(0x00d4ff, 2, 10);
            light.position.set(2, 5, 2);
            scene.add(light);
            camera.position.z = 3.2;

            function animate() {
                requestAnimationFrame(animate);
                core.rotation.y += 0.008;
                core.rotation.z += 0.003;
                
                if (analyzer) {
                    analyzer.getByteFrequencyData(dataArray);
                    let avg = dataArray.reduce((a,b)=>a+b)/dataArray.length;
                    let scale = 1 + (avg / 100);
                    core.scale.set(scale, scale, scale);
                    core.material.emissiveIntensity = 1 + (avg / 40);
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        // 2. [Audio] 시크한 여성 음성 출력
        function speak(text, callback) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            const voices = window.speechSynthesis.getVoices();
            // 가장 지적인 여성 목소리 선택 시도
            const femaleVoice = voices.find(v => v.lang.includes('ko') && (v.name.includes('Google') || v.name.includes('Yuna') || v.name.includes('Heami')));
            if (femaleVoice) msg.voice = femaleVoice;
            
            msg.rate = 1.05; msg.pitch = 0.9; // 시크한 톤 조절
            msg.onstart = () => { document.getElementById('ui-ring').classList.add('active-ring'); };
            msg.onend = () => { 
                document.getElementById('ui-ring').classList.remove('active-ring');
                if(callback) callback(); 
            };
            window.speechSynthesis.speak(msg);
        }

        // 3. [Logic] 음성 인식 및 명령어 처리
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'ko-KR';
        recognition.continuous = true;

        recognition.onresult = async (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.trim();
            document.getElementById('log').innerText = transcript;

            if (transcript.includes("자비스")) {
                document.getElementById('status').innerText = "Listening...";
                speak("준비되었습니다, 주현.");
                isListening = true;
            } else if (isListening) {
                processAI(transcript);
                isListening = false;
            }
        };

        async function processAI(cmd) {
            document.getElementById('status').innerText = "Processing...";
            try {
                const res = await fetch(HF_ENDPOINT, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        prompt: `너는 주현의 시크하고 유능한 30대 여성 R&D 파트너 자비스다. 불필요한 말 없이 핵심만 시크하게 대답해.\n주현: ${cmd}\n자비스:`,
                        n_predict: 96, stop: ["주현:", "\n"]
                    })
                });
                const data = await res.json();
                const aiResponse = data.content;
                
                const urlMatch = aiResponse.match(/!open\s+(https?:\/\/\S+)/);
                const speechText = aiResponse.replace(/!open\s+https?:\/\/\S+/, "").trim();

                speak(speechText, () => {
                    if(urlMatch) window.open(urlMatch[1], "_blank");
                    document.getElementById('status').innerText = "Neural Link: Stable";
                });
            } catch(e) {
                speak("서버 응답 에러입니다. 연결 상태를 확인하세요.");
            }
        }

        // 초기화 클릭 이벤트
        document.body.onclick = async () => {
            if (renderer) return; // 이미 실행 중이면 무시
            
            initJarvisCore();
            
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            const ctx = new AudioContext();
            const src = ctx.createMediaStreamSource(stream);
            analyzer = ctx.createAnalyser();
            analyzer.fftSize = 64;
            src.connect(analyzer);
            dataArray = new Uint8Array(analyzer.frequencyBinCount);
            
            recognition.start();
            document.getElementById('status').innerText = "Neural Link: Online";
            document.getElementById('log').innerText = '"자비스"라고 불러주세요.';
            speak("시스템 동기화 완료. 자비스 활성화되었습니다.");
        };

        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    </script>
</body>
</html>
