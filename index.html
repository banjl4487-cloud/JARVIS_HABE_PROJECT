<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        body {
            background-color: #050505; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }
        #jarvis-core-wrapper {
            position: relative; width: 250px; height: 250px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
            transition: all 0.3s ease;
        }
        #jarvis-core {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; position: absolute;
            animation: pulse 2s infinite;
        }
        #jarvis-core-inner {
            width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff; animation: spin 10s linear infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #response-box {
            position: absolute; bottom: 160px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.1rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
            max-height: 200px; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .mode-container {
            position: absolute; top: 30px; display: flex; gap: 10px; background: rgba(0,240,255,0.1);
            padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(0,240,255,0.3);
        }
        .mode-btn {
            background: transparent; border: none; color: #777; font-weight: bold; cursor: pointer; padding: 5px 10px; font-family: 'Courier New', Courier, monospace;
        }
        .mode-btn.active {
            color: #00f0ff; text-shadow: 0 0 8px #00f0ff;
        }
    </style>
</head>
<body>
    <div class="mode-container">
        <button id="textModeBtn" class="mode-btn active" onclick="switchMode('text')">💬 텍스트 모드</button>
        <button id="voiceModeBtn" class="mode-btn" onclick="switchMode('voice')">🎤 음성 대화 모드</button>
    </div>

    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="response-box"></div>

    <div style="position: absolute; bottom: 40px; width: 100%; text-align: center;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 50%; max-width: 350px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;">
        <button id="sendBtn" onclick="sendTextCommand()" style="padding: 12px 20px; margin-left: 8px; background: #00f0ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">전송</button>
        <button id="micBtn" onclick="toggleVoiceInput()" style="display: none; padding: 15px 30px; background: transparent; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem;">👏 박수를 치거나 클릭하세요</button>
    </div>

    <script>
        let currentMode = 'text';
        let recognition = null;
        let isListening = false;
        let finalTranscript = '';
        
        // 🎙️ 목소리 정제 2중 오디오 필터 변수
        let audioContext = null;
        let mediaStreamSource = null;
        let highPassFilter = null; // 1차 방어선: 선풍기 등 저주파 잡음 커팅
        let voiceBoostFilter = null; // 2차 방어선: 사람 목소리 명료도(중고역대) 집중 부스팅 및 잡음 억제
        let analyser = null;
        let isDualPipelineActive = false;

        function switchMode(mode) {
            currentMode = mode;
            const textBtn = document.getElementById("textModeBtn");
            const voiceBtn = document.getElementById("voiceModeBtn");
            const micBtn = document.getElementById("micBtn");
            const inputField = document.getElementById("tempInput");
            const sendBtn = document.getElementById("sendBtn");

            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (recognition && isListening) {
                recognition.stop();
            }
            stopVoicePipeline();

            if (mode === 'text') {
                textBtn.classList.add('active');
                voiceBtn.classList.remove('active');
                inputField.style.display = 'inline-block';
                sendBtn.style.display = 'inline-block';
                micBtn.style.display = 'none';
            } else {
                voiceBtn.classList.add('active');
                textBtn.classList.remove('active');
                inputField.style.display = 'none';
                sendBtn.style.display = 'none';
                micBtn.style.display = 'inline-block';
                
                // 음성 모드 진입 시 2중 목소리 정제 파이프라인 가동
                startVoicePipeline();
            }
        }

        // 🛡️ [2중 목소리 정제 파이프라인] 구현
        async function startVoicePipeline() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStreamSource = audioContext.createMediaStreamSource(stream);

                // [1차 방어선] High-pass Filter: 300Hz 이하의 웅웅거리는 선풍기/팬 소음 원천 차단
                highPassFilter = audioContext.createBiquadFilter();
                highPassFilter.type = "highpass";
                highPassFilter.frequency.setValueAtTime(300, audioContext.currentTime);

                // [2차 방어선] Peaking Filter (Voice Boost): 사람 목소리가 선명하게 들리는 대역(약 1500Hz)을 강조하여 STT 인식률 극대화
                voiceBoostFilter = audioContext.createBiquadFilter();
                voiceBoostFilter.type = "peaking";
                voiceBoostFilter.frequency.setValueAtTime(1500, audioContext.currentTime);
                voiceBoostFilter.Q.setValueAtTime(1.0, audioContext.currentTime);
                voiceBoostFilter.gain.setValueAtTime(5.0, audioContext.currentTime); // 목소리 대역 5dB 부스팅

                // 박수 및 볼륨 감지용 분석기
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                // [직렬 연결 구조]: 마이크 ➡️ 1차 필터(잡음제거) ➡️ 2차 필터(목소리강화) ➡️ 분석기
                mediaStreamSource.connect(highPassFilter);
                highPassFilter.connect(voiceBoostFilter);
                voiceBoostFilter.connect(analyser);

                isDualPipelineActive = true;
                monitorVoiceInput(); // 박수 및 볼륨 트리거 모니터링 시작
            } catch (e) {
                console.error("2중 목소리 파이프라인 초기화 실패:", e);
            }
        }

        function stopVoicePipeline() {
            isDualPipelineActive = false;
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.suspend();
            }
        }

        // 박수 소리 및 유효 입력 감지 루프
        function monitorVoiceInput() {
            if (!isDualPipelineActive || !analyser) return;

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sum += dataArray[i];
            }
            let average = sum / dataArray.length;

            // 박수 소리 등 순간적 충격음 감지 시 준비 상태로 진입
            if (average > 45 && !isListening && currentMode === 'voice') {
                triggerJarvisReady();
            }

            if (isDualPipelineActive) {
                requestAnimationFrame(monitorVoiceInput);
            }
        }

        function triggerJarvisReady() {
            const micBtn = document.getElementById("micBtn");
            const coreWrapper = document.getElementById("jarvis-core-wrapper");
            
            coreWrapper.style.filter = "drop-shadow(0 0 35px #ff0055)";
            micBtn.style.background = "#ff0055";
            micBtn.style.color = "#fff";
            micBtn.innerText = "🔴 음성 정제 중! 말씀하세요...";

            setTimeout(() => {
                coreWrapper.style.filter = "drop-shadow(0 0 20px #00f0ff)";
            }, 500);

            startVoiceRecognitionProcess();
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            
            utterance.onend = () => {
                if (currentMode === 'voice' && !isListening) {
                    resetMicButton();
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'ko-KR';
            rec.interimResults = true;
            rec.continuous = true;     

            rec.onstart = () => {
                isListening = true;
                finalTranscript = '';
                const micBtn = document.getElementById("micBtn");
                micBtn.style.background = "#ff0055";
                micBtn.style.color = "#fff";
                micBtn.innerText = "🔴 듣고 있습니다... (다 말씀하시면 다시 클릭)";
            };

            rec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                document.getElementById("tempInput").value = finalTranscript + interim;
            };

            rec.onerror = (event) => {
                console.error("음성 인식 오류:", event.error);
                isListening = false;
                resetMicButton();
            };

            rec.onend = () => {
                isListening = false;
                resetMicButton();
                const completeText = document.getElementById("tempInput").value.trim();
                if (completeText) {
                    document.getElementById("tempInput").value = "";
                    fetchToGemma(completeText);
                }
            };

            return rec;
        }

        function resetMicButton() {
            const micBtn = document.getElementById("micBtn");
            micBtn.style.background = "transparent";
            micBtn.style.color = "#00f0ff";
            micBtn.innerText = "👏 박수를 치거나 클릭하세요";
        }

        function startVoiceRecognitionProcess() {
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            if (!isListening && currentMode === 'voice') {
                try {
                    if (window.speechSynthesis) window.speechSynthesis.cancel();
                    recognition.start();
                } catch (e) {
                    console.error(e);
                }
            }
        }

        function toggleVoiceInput() {
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }

            if (isListening) {
                recognition.stop(); 
            } else {
                triggerJarvisReady();
            }
        }

        async function fetchToGemma(userQuestion) {
            if (recognition && isListening) {
                recognition.stop();
            }

            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerHTML = "<div>사고 로직 가동 중...</div>";
            
            try {
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: userQuestion })
                });

                if (!response.ok) throw new Error("서버 통신 오류");

                const result = await response.json();
                let rawText = result.choices[0].text;
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                const jsonMatch = rawText.match(/\{.*\}/s);
                if (!jsonMatch) throw new Error("응답에서 데이터를 찾을 수 없습니다.");
                
                const data = new Function(`return ${jsonMatch[0]}`)();
                
                responseBox.innerHTML = `<div>${data.reply}</div>`;
                if (data.reply) {
                    speakText(data.reply);
                }
                
                if (data.status === "OPEN") {
                    setTimeout(() => {
                        window.open(data.action, "_blank");
                    }, 500);
                }

            } catch (error) {
                console.error("오류 발생:", error);
                responseBox.innerText = "연결 오류 발생. 주현아, 백엔드 서버 로그나 콘솔 확인해!";
                speakText("연결 오류가 발생했습니다.");
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
