<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS System - R&D MLOps Pipeline</title>
    <style>
        body {
            background-color: #050505; color: #00f0ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0; overflow: hidden;
        }
        #jarvis-core-wrapper {
            position: relative; width: 250px; height: 250px; display: flex;
            justify-content: center; align-items: center; z-index: 10;
            filter: drop-shadow(0 0 20px #00f0ff);
        }
        #jarvis-core {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00f0ff;
            box-shadow: 0 0 15px #00f0ff, inset 0 0 15px #00f0ff; position: absolute;
            animation: pulse 2s infinite;
        }
        #jarvis-core-inner {
            width: 80%; height: 80%; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,240,255,0.8) 0%, rgba(0,240,255,0) 70%);
            border: 2px dashed #00f0ff; animation: spin 10s linear infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        #response-box {
            position: absolute; bottom: 160px; width: 80%; max-width: 600px;
            text-align: center; font-size: 1.1rem; color: #00f0ff;
            background: rgba(0, 240, 255, 0.05); border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 10px; padding: 20px; display: none;
            max-height: 200px; overflow-y: auto;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .mode-container {
            position: absolute; top: 30px; display: flex; gap: 10px; background: rgba(0,240,255,0.1);
            padding: 5px 15px; border-radius: 20px; border: 1px solid rgba(0,240,255,0.3);
        }
        .mode-btn {
            background: transparent; border: none; color: #777; font-weight: bold; cursor: pointer; padding: 5px 10px; font-family: 'Courier New', Courier, monospace;
        }
        .mode-btn.active {
            color: #00f0ff; text-shadow: 0 0 8px #00f0ff;
        }
    </style>
</head>
<body>
    <div class="mode-container">
        <button id="textModeBtn" class="mode-btn active" onclick="switchMode('text')">💬 텍스트 모드</button>
        <button id="voiceModeBtn" class="mode-btn" onclick="switchMode('voice')">🎤 음성 대화 모드</button>
    </div>

    <div id="jarvis-core-wrapper">
        <div id="jarvis-core"></div>
        <div id="jarvis-core-inner"></div>
    </div>
    <div id="response-box"></div>

    <div style="position: absolute; bottom: 40px; width: 100%; text-align: center;">
        <input type="text" id="tempInput" placeholder="시스템 명령어 입력..." 
               style="padding: 12px; width: 50%; max-width: 350px; border-radius: 8px; border: 1px solid #00f0ff; background: rgba(0,0,0,0.7); color: #00f0ff; outline: none;">
        <button id="sendBtn" onclick="sendTextCommand()" style="padding: 12px 20px; margin-left: 8px; background: #00f0ff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">전송</button>
        <button id="micBtn" onclick="toggleVoiceInput()" style="display: none; padding: 15px 30px; background: transparent; color: #00f0ff; border: 1px solid #00f0ff; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem;">🎤 말씀하시려면 클릭하세요</button>
    </div>

    <script>
        let currentMode = 'text';
        let recognition = null;
        let isListening = false;
        let finalTranscript = '';
        
        // 잡음 제거(노이즈 필터링)를 위한 변수
        let audioContext = null;
        let mediaStreamSource = null;
        let biquadFilter = null;

        function switchMode(mode) {
            currentMode = mode;
            const textBtn = document.getElementById("textModeBtn");
            const voiceBtn = document.getElementById("voiceModeBtn");
            const micBtn = document.getElementById("micBtn");
            const inputField = document.getElementById("tempInput");
            const sendBtn = document.getElementById("sendBtn");

            if (window.speechSynthesis) window.speechSynthesis.cancel();
            if (recognition && isListening) {
                recognition.stop();
            }
            stopNoiseFilter();

            if (mode === 'text') {
                textBtn.classList.add('active');
                voiceBtn.classList.remove('active');
                inputField.style.display = 'inline-block';
                sendBtn.style.display = 'inline-block';
                micBtn.style.display = 'none';
            } else {
                voiceBtn.classList.add('active');
                textBtn.classList.remove('active');
                inputField.style.display = 'none';
                sendBtn.style.display = 'none';
                micBtn.style.display = 'inline-block';
                startNoiseFilter(); // 음성 모드 진입 시 마이크 노이즈 필터 대기
            }
        }

        // Web Audio API를 이용해 선풍기 바람 같은 저주파 소음(웅웅거림)을 걸러내는 필터 작동 함수
        async function startNoiseFilter() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStreamSource = audioContext.createMediaStreamSource(stream);

                // High-pass Filter 생성 (설정한 주파수보다 낮은 대역인 선풍기 소음 등을 깎아냄)
                biquadFilter = audioContext.createBiquadFilter();
                biquadFilter.type = "highpass";
                biquadFilter.frequency.setValueAtTime(300, audioContext.currentTime); // 300Hz 이하 소음 차단

                mediaStreamSource.connect(biquadFilter);
                // 필터링된 오디오 스트림 유지
            } catch (e) {
                console.error("마이크 노이즈 필터 초기화 실패:", e);
            }
        }

        function stopNoiseFilter() {
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.suspend();
            }
        }

        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("이 브라우저는 음성 인식을 지원하지 않습니다. Chrome을 사용해주세요.");
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'ko-KR';
            rec.interimResults = true;
            rec.continuous = true;     

            rec.onstart = () => {
                isListening = true;
                finalTranscript = '';
                const micBtn = document.getElementById("micBtn");
                micBtn.style.background = "#ff0055";
                micBtn.style.color = "#fff";
                micBtn.innerText = "🔴 듣고 있습니다... (다 말씀하시면 다시 클릭)";
            };

            rec.onresult = (event) => {
                let interim = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }
                document.getElementById("tempInput").value = finalTranscript + interim;
            };

            rec.onerror = (event) => {
                console.error("음성 인식 오류:", event.error);
                isListening = false;
                resetMicButton();
            };

            rec.onend = () => {
                isListening = false;
                resetMicButton();
                const completeText = document.getElementById("tempInput").value.trim();
                if (completeText) {
                    document.getElementById("tempInput").value = "";
                    fetchToGemma(completeText);
                }
            };

            return rec;
        }

        function resetMicButton() {
            const micBtn = document.getElementById("micBtn");
            micBtn.style.background = "transparent";
            micBtn.style.color = "#00f0ff";
            micBtn.innerText = "🎤 말씀하시려면 클릭하세요";
        }

        function toggleVoiceInput() {
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }

            if (isListening) {
                recognition.stop(); 
            } else {
                if (window.speechSynthesis) window.speechSynthesis.cancel(); 
                recognition.start();
            }
        }

        async function fetchToGemma(userQuestion) {
            const responseBox = document.getElementById("response-box");
            responseBox.style.display = "block";
            responseBox.innerHTML = "<div>사고 로직 가동 중...</div>";
            
            try {
                const response = await fetch("https://banjl4487-jarvis-habe-project.hf.space/chat/completions", { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: userQuestion })
                });

                if (!response.ok) throw new Error("서버 통신 오류");

                const result = await response.json();
                let rawText = result.choices[0].text;
                rawText = rawText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                const jsonMatch = rawText.match(/\{.*\}/s);
                if (!jsonMatch) throw new Error("응답에서 데이터를 찾을 수 없습니다.");
                
                const data = new Function(`return ${jsonMatch[0]}`)();
                
                responseBox.innerHTML = `<div>${data.reply}</div>`;
                if (data.reply) {
                    speakText(data.reply);
                }
                
                if (data.status === "OPEN") {
                    setTimeout(() => {
                        window.open(data.action, "_blank");
                    }, 500);
                }

            } catch (error) {
                console.error("오류 발생:", error);
                responseBox.innerText = "연결 오류 발생. 주현아, 백엔드 서버 로그나 콘솔 확인해!";
                speakText("연결 오류가 발생했습니다.");
            }
        }

        function sendTextCommand() {
            const inputField = document.getElementById("tempInput");
            if (!inputField.value.trim()) return; 
            fetchToGemma(inputField.value);
            inputField.value = "";
        }
    </script>
</body>
</html>
